{% extends 'base.html' %}
{% block header %}
  <h1>{% block title %}Hosts{% endblock %}</h1>
{% endblock %}

{% block content %}
<table>
    <thead>
        <tr>
            <th>Host Name</th>
        </tr>
    </thead>
    <tbody>
        {% for host in hosts %}
        <tr>
            <td><a href="{{ url_for('host.show_detail', host_id=host.id) }}">{{ host.name }}</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
