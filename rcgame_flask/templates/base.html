<!doctype html>
<title>{% block title %}{% endblock %} - RCgame</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<!-- テーブルのデザインを固定 -->
<style>
  table {
      width: 100%;
      border-collapse: collapse;
  }
  th, td {
      border: 1px solid #000000;
      padding: 8px;
      word-wrap: break-word;
      max-width: 200px; 
  }
  th {
      background-color: #f2f2f2;
      text-align: left;
  }
  tr:nth-child(even) {
      background-color: #f7f5f5;
  }
  tr:hover {
      background-color: #ddd;
  }
  .footer-nav {
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ffffff;
            padding: 1rem;
            border: 1px solid #ddd;
        }
        .footer-nav a {
            text-decoration: none;
            color: #377ba8;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #f3f3f3; /* 各リンクを線で囲む */
            border-radius: 4px; /* 角を丸くする */
            font-weight: bold; /* フォントを太くする */
            font-size: 1.1em; /* フォントサイズを大きくする */
        }
        .footer-nav a:hover {
            background-color: #ddd; /* ホバー時の背景色を変更 */
            color: #000; /* ホバー時の文字色を変更 */
        }
</style>
<nav>
  <h1>RCgame</h1>
</nav>
<section class="content">
  <header>
    {% block header %}{% endblock %}
  </header>
  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</section>
<!-- index.html 以外の画面に表示されるフッター -->
{% if request.path != '/' %}
<footer>
  <div class="footer-nav">
    <a href="{{ url_for('index') }}">メインメニュー</a>
    <a href="{{ url_for('select_match.select_team') }}">スケジューリング</a>
    <a href="{{ url_for('dbdisplay.show_teams') }}">チーム一覧を表示</a>
    <a href="{{ url_for('dbdisplay.show_group_matches') }}">対戦組み合わせを表示</a>
</div>
</footer>
{% endif %}
