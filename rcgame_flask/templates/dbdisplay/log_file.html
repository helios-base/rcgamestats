{% extends 'base.html' %}
{% block header %}
  <h1>{% block title %}Log Files{% endblock %}</h1>
{% endblock %}

{% block content %}
<ul>
  {% for log_file in log_files %}
    <li><a href="{{ url_for('static', filename='logs/' ~ log_file_path ~ '/' ~ log_file) }}">{{ log_file }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
