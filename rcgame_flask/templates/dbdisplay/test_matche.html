{% extends 'base.html' %}
{% block header %}
  <h1>{% block title %}matchs{% endblock %}</h1>
  <a class="action" href="{{ url_for('select_match.select_team') }}">スケジューリング</a>
{% endblock %}

{% block content %}
<table border="1">
    <thead>
        <tr>
            <th>team1</th>
            <th>team2</th>
            <th>マッチ数</th>
        </tr>
    </thead>
    <tbody>
        {% for match in match %}
        <tr>
            <td>{{ match.left_team }}</td>
            <td>{{ match.light_team }}</td>
            <td>{{ match.Mcount }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
