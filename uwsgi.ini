[uwsgi]
;chdir = /path-to/rcgamestats
;pythonpath = /path-to/rcgamestats

; Flaskアプリケーションのモジュール。例：server/app.py 内の app インスタンス
module = server.app:app

; HTTPモードで127.0.0.1:5000でリッスン（Apacheからリバースプロキシ予定）
http = 127.0.0.1:5000

; マスタープロセスの起動（推奨設定）
master = true

; ワーカープロセス数（必要に応じて調整）
processes = 5

; スレッド数（各プロセスあたり）
threads = 2

; 終了時にソケットファイルなどの一時ファイルをクリーンアップ
vacuum = true

; TERMシグナル時にきちんと終了する
die-on-term = true

; 
;buffer-size = 65535
;max-body-size = 52428800 ; 50MB

# POST関連の読み込み保護設定
;post-buffering = 8192
;read-timeout = 120
;socket-timeout = 120
;http-timeout = 120
;harakiri = 300


