[uwsgi]
;chdir = /path-to/rcgamestats
;pythonpath = /path-to/rcgamestats

; Flaskアプリケーションのモジュール。例：rcgame_flask/app.py 内の app インスタンス
module = rcgame_flask.app:app

; HTTPモードで127.0.0.1:5000でリッスン（Apacheからリバースプロキシ予定）
http = 127.0.0.1:5000

; マスタープロセスの起動（推奨設定）
master = true

; ワーカープロセス数（必要に応じて調整）
processes = 5

; スレッド数（各プロセスあたり）
threads = 2

; 終了時にソケットファイルなどの一時ファイルをクリーンアップ
vacuum = true

; TERMシグナル時にきちんと終了する
die-on-term = true
